name: Build PyVault Android
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android Flutter project
        run: |
          cp pubspec.yaml /tmp/pyvault-pubspec.yaml
          cp main.dart /tmp/pyvault-main.dart
          flutter create . --platforms=android --org com.pyvault --project-name pyvault
          mkdir -p lib
          cp /tmp/pyvault-main.dart lib/main.dart
          cp /tmp/pyvault-pubspec.yaml pubspec.yaml
          rm -rf test
          cat > analysis_options.yaml <<'EOF'
          analyzer:
            exclude:
              - build/**
              - test/**
              - main.dart
              - protector_core.py
          EOF
      - name: Configure Chaquopy and offline Python module
        run: python prepare_android.py
      - name: Flutter dependencies and checks
        run: |
          flutter pub get
          dart format lib/main.dart
          flutter analyze
      - name: Build arm64 release APK
        run: flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols
      - uses: actions/upload-artifact@v4
        with:
          name: pyvault-arm64-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Run protector tests
        run: |
          python -m pip install cryptography==50.0.2 pytest
          python -m pytest -q
