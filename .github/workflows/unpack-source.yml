name: Import PyVault source bundle
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Unpack the real project files
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, zipfile
          archive = pathlib.Path("PyVault_source.zip")
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  path = pathlib.PurePosixPath(item.filename)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit("Unsafe archive path: " + item.filename)
              z.extractall(".")
          archive.unlink()
          pathlib.Path(".github/workflows/unpack-source.yml").unlink()
          PY
      - name: Commit extracted source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add complete PyVault project source"
            git push origin HEAD:main
          fi
